name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        env:
          # Every build gets a higher version number, so it installs as an update.
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "TabLauncher-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: TabLauncher-1.0.${{ github.run_number }}
          path: TabLauncher-*.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          VERSION="1.0.${{ github.run_number }}"
          printf 'Install the APK on your tablet. It installs as an update over the previous version (same signing key), keeping your layout and settings.\n\nChanges: %s\n' "${COMMIT_MSG%%$'\n'*}" > notes.txt
          gh release create "v$VERSION" "TabLauncher-$VERSION.apk" \
            --title "TabLauncher $VERSION" \
            --target "${{ github.sha }}" \
            --notes-file notes.txt
