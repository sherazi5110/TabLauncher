<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TabLauncher mockups</title>
<!--
  Design mockups for TabLauncher. Render a screen with query params:
    ?s=home|today|library|search  &t=light|dark  &o=land|port
  App icons here are generic placeholders; on the tablet the launcher shows
  your real app icons (re-coloured for dark mode).
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Inter, sans-serif; background: #000; }
  .screen { position: relative; overflow: hidden; }
  .abs { position: absolute; }
  .light { --text: #1C1C1E; --text2: #6B6B72; --card: #FFFFFF; --card2: #F2F2F5; --line: #E6E6EA;
           --shadow: 0 6px 22px rgba(20, 24, 40, .10); --page: #F2F2F7; --accent: #2F6BFF; }
  .dark  { --text: #F5F5F7; --text2: #9A9AA2; --card: #1C1C1E; --card2: #2A2A2D; --line: #2E2E32;
           --shadow: 0 6px 22px rgba(0, 0, 0, .45); --page: #0B0B0D; --accent: #5B8CFF; }

  .ic { display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden;
        box-shadow: 0 2px 6px rgba(0,0,0,.12); }
  .ic svg { display: block; }
  .cell { position: absolute; display: flex; flex-direction: column; align-items: center; }
  .label { margin-top: 7px; font-size: 12.5px; font-weight: 500; color: var(--text); white-space: nowrap;
           max-width: 100%; overflow: hidden; text-overflow: ellipsis; }

  .card { background: var(--card); border-radius: 22px; box-shadow: var(--shadow); color: var(--text); }
  .card-h { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text2);
            display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 4px; display: inline-block; }

  .dock { background: var(--card); border-radius: 30px; box-shadow: var(--shadow); display: flex; align-items: center;
          padding: 14px; gap: 18px; }
  .dark .dock { border: 1px solid #2C2C30; }
  .dock .sep { width: 1px; align-self: stretch; background: var(--line); margin: 4px 0; }

  .statusbar { position: absolute; top: 0; left: 0; right: 0; height: 30px; display: flex; align-items: center;
               justify-content: space-between; padding: 0 24px; font-size: 13px; font-weight: 600; color: var(--text); z-index: 5; }
  .sb-r { display: flex; gap: 8px; align-items: center; }

  .pill { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); display: flex; align-items: center;
          gap: 10px; color: var(--text2); font-size: 16px; }
  .chip { font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 16px; background: var(--card2); color: var(--text2); }
  .chip.on { background: var(--accent); color: #fff; }
  .row { display: flex; align-items: center; }
  .kbd { background: #D3D6DD; }
  .dark .kbd { background: #2B2B2F; }
  .key { background: #fff; border-radius: 7px; height: 52px; display: flex; align-items: center; justify-content: center;
         font-size: 20px; color: #1C1C1E; box-shadow: 0 1px 0 rgba(0,0,0,.25); }
  .dark .key { background: #48484D; color: #fff; }
  .key.mod { background: #ADB2BC; font-size: 15px; }
  .dark .key.mod { background: #333338; }
</style>
</head>
<body>
<div id="screen" class="screen"></div>
<script>
const P = new URLSearchParams(location.search);
const S = P.get('s') || 'home', T = P.get('t') || 'light', O = P.get('o') || 'land';
const LAND = O === 'land';
const W = LAND ? 1280 : 800, H = LAND ? 800 : 1280;
const DARK = T === 'dark';
const root = document.getElementById('screen');
root.className = `screen ${T}`;
root.style.width = W + 'px'; root.style.height = H + 'px';

// ---------- glyphs (24x24, drawn with currentColor; --c is the cut-out colour) ----------
const CUT = 'style="fill:var(--c)"', CUTS = 'style="stroke:var(--c)"';
const GL = {
  globe: `<circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><ellipse cx="12" cy="12" rx="3.8" ry="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 12h17M5 7.6h14M5 16.4h14" stroke="currentColor" stroke-width="1.4"/>`,
  mail: `<rect x="3" y="5.5" width="18" height="13" rx="2.5" fill="currentColor"/><path d="M3.8 7l8.2 6 8.2-6" fill="none" ${CUTS} stroke-width="1.7"/>`,
  chat: `<path d="M12 4C7 4 3 7.3 3 11.4c0 2.3 1.3 4.4 3.3 5.8L5.6 20.5l3.6-2c.9.2 1.8.3 2.8.3 5 0 9-3.3 9-7.4S17 4 12 4z" fill="currentColor"/>`,
  play: `<path d="M8.5 5.5v13l11-6.5z" fill="currentColor"/>`,
  note: `<path d="M9 18.5a2.5 2.5 0 1 1-2.5-2.5c.6 0 1.1.2 1.5.5V6l10-2v11.5a2.5 2.5 0 1 1-2.5-2.5c.6 0 1.1.2 1.5.5V7.3L9 8.8z" fill="currentColor"/>`,
  camera: `<rect x="3" y="7" width="18" height="12.5" rx="3" fill="currentColor"/><path d="M8.3 7.5l1.6-2.8h4.2l1.6 2.8z" fill="currentColor"/><circle cx="12" cy="13.2" r="3.7" ${CUT}/><circle cx="12" cy="13.2" r="2.2" fill="currentColor"/>`,
  folder: `<path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h4l2 2h7A2.5 2.5 0 0 1 21 9.5v8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z" fill="currentColor"/>`,
  gear: `<circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="3.6" stroke-dasharray="2.75 2.75"/><circle cx="12" cy="12" r="5.6" fill="currentColor"/><circle cx="12" cy="12" r="2.3" ${CUT}/>`,
  notes: `<rect x="5" y="3.5" width="14" height="17" rx="2.5" fill="currentColor"/><path d="M8 8.5h8M8 12h8M8 15.5h5" ${CUTS} stroke-width="1.6" stroke-linecap="round"/>`,
  pin: `<path d="M12 3a6 6 0 0 0-6 6c0 4.5 6 11.5 6 11.5S18 13.5 18 9a6 6 0 0 0-6-6z" fill="currentColor"/><circle cx="12" cy="9" r="2.3" ${CUT}/>`,
  bag: `<path d="M5 8.5h14l-1.2 11a1.8 1.8 0 0 1-1.8 1.5H8a1.8 1.8 0 0 1-1.8-1.5z" fill="currentColor"/><path d="M9 10.5V7a3 3 0 0 1 6 0v3.5" fill="none" ${CUTS} stroke-width="1.7" stroke-linecap="round"/>`,
  cloud: `<circle cx="9" cy="8.5" r="3.3" fill="#FFD54A"/><path d="M8 19a4.3 4.3 0 0 1-.4-8.6 5.3 5.3 0 0 1 10.2-.3A4.5 4.5 0 0 1 17.3 19z" fill="currentColor"/>`,
  calc: `<rect x="5" y="3.5" width="14" height="17" rx="2.5" fill="currentColor"/><rect x="7.5" y="6" width="9" height="3.5" rx="1" ${CUT}/><g ${CUT}><circle cx="8.6" cy="12.6" r="1.1"/><circle cx="12" cy="12.6" r="1.1"/><circle cx="15.4" cy="12.6" r="1.1"/><circle cx="8.6" cy="16.4" r="1.1"/><circle cx="12" cy="16.4" r="1.1"/><circle cx="15.4" cy="16.4" r="1.1"/></g>`,
  book: `<path d="M3 6c3-1.5 6-1.5 9 .5v13c-3-2-6-2-9-.5zM21 6c-3-1.5-6-1.5-9 .5v13c3-2 6-2 9-.5z" fill="currentColor"/><path d="M12 6.5v13" ${CUTS} stroke-width="1.2"/>`,
  game: `<path d="M7 8h10a4.5 4.5 0 0 1 4.3 5.8l-.9 3a2.4 2.4 0 0 1-4 1L15 16H9l-1.4 1.8a2.4 2.4 0 0 1-4-1l-.9-3A4.5 4.5 0 0 1 7 8z" fill="currentColor"/><path d="M8 10.6v3.2M6.4 12.2h3.2" ${CUTS} stroke-width="1.5" stroke-linecap="round"/><circle cx="15.4" cy="11.3" r="1.05" ${CUT}/><circle cx="17.1" cy="13.3" r="1.05" ${CUT}/>`,
  podcast: `<circle cx="12" cy="10" r="2.6" fill="currentColor"/><path d="M10.6 14h2.8l-.6 6.5h-1.6z" fill="currentColor"/><path d="M7.4 14.6a6.4 6.4 0 1 1 9.2 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>`,
  tv: `<rect x="3" y="5" width="18" height="12" rx="2" fill="currentColor"/><path d="M9 20h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M10.4 8.6v5l4.2-2.5z" ${CUT}/>`,
  heart: `<path d="M12 20s-7.5-4.6-7.5-10A4.2 4.2 0 0 1 12 7.6 4.2 4.2 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z" fill="currentColor"/>`,
  people: `<circle cx="9" cy="9" r="3" fill="currentColor"/><path d="M3.5 18.5c0-3 2.5-5 5.5-5s5.5 2 5.5 5z" fill="currentColor"/><circle cx="16.6" cy="9.6" r="2.4" fill="currentColor" opacity=".75"/><path d="M15.4 13.6c3 0 5.1 1.9 5.1 4.9h-4.6z" fill="currentColor" opacity=".75"/>`,
  film: `<circle cx="12" cy="12" r="8.4" fill="currentColor"/><g ${CUT}><circle cx="12" cy="7.4" r="1.9"/><circle cx="12" cy="16.6" r="1.9"/><circle cx="7.4" cy="12" r="1.9"/><circle cx="16.6" cy="12" r="1.9"/><circle cx="12" cy="12" r=".9"/></g>`,
  doc: `<path d="M6.5 3h7l4.5 4.5V19a2 2 0 0 1-2 2H6.5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z" fill="currentColor"/><path d="M8 11h8M8 14h8M8 17h5" ${CUTS} stroke-width="1.4"/>`,
  wallet: `<rect x="3" y="6" width="18" height="13" rx="2.5" fill="currentColor"/><rect x="14" y="10.5" width="7" height="4" rx="1.2" ${CUT}/>`,
  aa: `<text x="12" y="16.6" text-anchor="middle" font-family="Inter" font-weight="700" font-size="11.5" fill="currentColor">Aa</text>`,
  pencil: `<path d="M4 20l1-4.5L15.5 5a2.1 2.1 0 0 1 3 3L8 18.5z" fill="currentColor"/>`,
  video: `<rect x="3" y="7" width="12" height="10" rx="2.5" fill="currentColor"/><path d="M16 10.5l5-3v9l-5-3z" fill="currentColor"/>`,
  compass: `<circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M15.5 8.5L13 13l-4.5 2.5L11 11z" fill="currentColor"/>`,
  download: `<path d="M12 4v10M7.5 10l4.5 4.5 4.5-4.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 19h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>`,
  person: `<circle cx="12" cy="9" r="3.6" fill="currentColor"/><path d="M5 19.5c0-3.6 3.1-6 7-6s7 2.4 7 6z" fill="currentColor"/>`,
  star: `<path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8L3.5 9.7l5.9-.8z" fill="currentColor"/>`,
  store: `<path d="M5.5 4.3l9.2 7.7-9.2 7.7c-.3-.2-.5-.6-.5-1V5.3c0-.4.2-.8.5-1z" fill="currentColor"/><path d="M14.7 12l3.6-2.1c.9.5.9 1.7 0 2.2L14.7 14.2z" fill="currentColor" opacity=".8"/>`,
  mic: `<rect x="9" y="3.5" width="6" height="11" rx="3" fill="currentColor"/><path d="M6 11.5a6 6 0 0 0 12 0M12 17.5v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>`,
};

const APPS = {
  'Browser':    ['globe',  '#4A90FF', '#1D4ED8'],
  'Mail':       ['mail',   '#3EC1FF', '#0284C7'],
  'Messages':   ['chat',   '#4ADE80', '#16A34A'],
  'Video':      ['play',   '#FF6B6B', '#DC2626'],
  'Music':      ['note',   '#FF6B8A', '#E11D48'],
  'Photos':     ['special'],
  'Camera':     ['camera', '#A1A1AA', '#52525B'],
  'Files':      ['folder', '#6AA8FF', '#2563EB'],
  'Settings':   ['gear',   '#A8A8B0', '#5B5B63'],
  'Calendar':   ['special'],
  'Clock':      ['special'],
  'Notes':      ['notes',  '#FFD84D', '#EAB308'],
  'Maps':       ['pin',    '#34D399', '#059669'],
  'Store':      ['store',  '#2DD4BF', '#0E7490'],
  'Weather':    ['cloud',  '#7CC4FF', '#2563EB'],
  'Calculator': ['calc',   '#FFA23A', '#EA580C'],
  'Books':      ['book',   '#FF9F45', '#EA580C'],
  'Games':      ['game',   '#A98BFF', '#7C3AED'],
  'Podcasts':   ['podcast','#C98BFF', '#9333EA'],
  'TV':         ['tv',     '#52525B', '#18181B'],
  'Fitness':    ['heart',  '#FF7AC0', '#DB2777'],
  'Social':     ['people', '#8D96FF', '#4F46E5'],
  'MovieBox':   ['film',   '#FF5A75', '#9F1239'],
  'Docs':       ['doc',    '#5A9BFF', '#1D4ED8'],
  'Wallet':     ['wallet', '#22C996', '#047857'],
  'Translate':  ['aa',     '#7479FF', '#4338CA'],
  'Shop':       ['bag',    '#FF9A3D', '#F97316'],
  'Meet':       ['video',  '#2ED3BE', '#0D9488'],
  'Sketch':     ['pencil', '#FF7AC0', '#BE185D'],
  'Explore':    ['compass','#FF7A7A', '#B91C1C'],
  'Downloads':  ['download','#9BAAC0','#475569'],
  'Contacts':   ['person', '#B0B0B8', '#636369'],
  'Reader':     ['star',   '#FFB648', '#D97706'],
  'Recorder':   ['mic',    '#FF6B6B', '#B91C1C'],
};

function icon(name, size) {
  const a = APPS[name] || APPS['Settings'];
  const r = Math.round(size * 0.235);
  const darkBg = 'linear-gradient(180deg,#333337,#1C1C1F)';
  let inner = '', bg, cut, glyph;
  if (a[0] === 'special') {
    if (name === 'Calendar') {
      bg = DARK ? darkBg : '#fff';
      inner = `<div style="text-align:center;line-height:1"><div style="font-size:${size*.15}px;font-weight:700;color:#FF3B30;letter-spacing:.04em">FRI</div><div style="font-size:${size*.45}px;font-weight:400;color:${DARK?'#fff':'#1C1C1E'};margin-top:${size*.02}px">27</div></div>`;
    } else if (name === 'Clock') {
      bg = '#111113';
      const c = size * .4, hand = DARK ? '#FF9F0A' : '#FF9F0A';
      inner = `<svg width="${size}" height="${size}" viewBox="0 0 100 100"><circle cx="50" cy="50" r="38" fill="${DARK?'#2A2A2E':'#fff'}"/>${[...Array(12)].map((_,i)=>{const t=i*Math.PI/6;return `<line x1="${50+31*Math.sin(t)}" y1="${50-31*Math.cos(t)}" x2="${50+35*Math.sin(t)}" y2="${50-35*Math.cos(t)}" stroke="${DARK?'#bbb':'#1C1C1E'}" stroke-width="2"/>`}).join('')}<line x1="50" y1="50" x2="50" y2="28" stroke="${DARK?'#fff':'#1C1C1E'}" stroke-width="4" stroke-linecap="round"/><line x1="50" y1="50" x2="68" y2="58" stroke="${DARK?'#fff':'#1C1C1E'}" stroke-width="3" stroke-linecap="round"/><line x1="50" y1="50" x2="36" y2="70" stroke="${hand}" stroke-width="1.6"/><circle cx="50" cy="50" r="3" fill="${hand}"/></svg>`;
    } else if (name === 'Photos') {
      bg = DARK ? darkBg : '#fff';
      const cols = ['#FFB020','#FF6A3D','#E94C8B','#8C5CFF','#3B9BFF','#2CC66F','#C8D82C','#FFD028'];
      inner = `<svg width="${size*.78}" height="${size*.78}" viewBox="0 0 100 100">${cols.map((c,i)=>`<ellipse cx="50" cy="29" rx="12" ry="21" fill="${c}" opacity="${DARK?.75:.85}" transform="rotate(${i*45} 50 50)" style="mix-blend-mode:${DARK?'screen':'multiply'}"/>`).join('')}</svg>`;
    }
    return `<div class="ic" style="width:${size}px;height:${size}px;border-radius:${r}px;background:${bg}">${inner}</div>`;
  }
  if (DARK) { bg = darkBg; cut = '#232326'; glyph = a[1]; }
  else { bg = `linear-gradient(180deg,${a[1]},${a[2]})`; cut = a[2]; glyph = '#fff'; }
  return `<div class="ic" style="width:${size}px;height:${size}px;border-radius:${r}px;background:${bg};--c:${cut};color:${glyph}"><svg viewBox="0 0 24 24" width="${size*.6}" height="${size*.6}">${GL[a[0]]}</svg></div>`;
}

function folderIcon(apps, size) {
  const r = Math.round(size * 0.235), pad = size * .12, gap = size * .05;
  const mini = (size - pad * 2 - gap * 2) / 3;
  const bg = DARK ? '#2A2A2E' : '#E4E6EC';
  return `<div class="ic" style="width:${size}px;height:${size}px;border-radius:${r}px;background:${bg};box-shadow:none;display:grid;grid-template-columns:repeat(3,${mini}px);gap:${gap}px;padding:${pad}px;align-content:start">${apps.slice(0,9).map(n=>icon(n,mini)).join('')}</div>`;
}

function cell(x, y, w, name, size, label = name, folder = null) {
  return `<div class="cell" style="left:${x}px;top:${y}px;width:${w}px">${folder ? folderIcon(folder, size) : icon(name, size)}<div class="label">${label}</div></div>`;
}

// ---------- wallpaper (original wave design) ----------
function wallpaper() {
  const pal = DARK
    ? { bg: ['#090D1C', '#160E2A'], waves: [['#1B2D6B','#13204D'], ['#3A1F78','#281556'], ['#6B1D57','#4C143E'], ['#7A2E1D','#561F13'], ['#0F4E5C','#0A3640']] }
    : { bg: ['#E8F1FF', '#FCEFF7'], waves: [['#BFE0FF','#A6D1FF'], ['#D8CCFF','#C5B5FF'], ['#FFC9E2','#FFB3D5'], ['#FFD9B8','#FFC89C'], ['#C6F0E2','#A9E6D1']] };
  let paths = '';
  pal.waves.forEach((c, i) => {
    const base = H * (0.18 + i * 0.17), amp = H * 0.05, f = 1.4 + i * .15, ph = i * 1.3;
    let d = `M0 ${H}`;
    for (let x = 0; x <= W; x += 16) {
      const y = base + amp * Math.sin(x / W * Math.PI * f + ph) - (x / W) * H * 0.12;
      d += ` L${x} ${y.toFixed(1)}`;
    }
    d += ` L${W} ${H} Z`;
    paths += `<linearGradient id="g${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c[0]}"/><stop offset="1" stop-color="${c[1]}"/></linearGradient><path d="${d}" fill="url(#g${i})"/>`;
  });
  return `<svg class="abs" style="left:0;top:0" width="${W}" height="${H}"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${pal.bg[0]}"/><stop offset="1" stop-color="${pal.bg[1]}"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#bg)"/>${paths}</svg>`;
}

function statusBar(extra = '') {
  return `<div class="statusbar"><div>9:41&nbsp;&nbsp;Fri Nov 27</div><div class="sb-r">${extra}
    <svg width="17" height="13" viewBox="0 0 17 13"><path d="M8.5 12.5l2.4-2.9a3.7 3.7 0 0 0-4.8 0zM8.5 3a9.6 9.6 0 0 1 7.3 3.3l1.2-1.5A11.6 11.6 0 0 0 8.5 1 11.6 11.6 0 0 0 0 4.8l1.2 1.5A9.6 9.6 0 0 1 8.5 3zm0 3.3a6.3 6.3 0 0 1 4.6 2l1.2-1.4a8.3 8.3 0 0 0-11.6 0l1.2 1.4a6.3 6.3 0 0 1 4.6-2z" fill="currentColor"/></svg>
    <span>82%</span><svg width="26" height="13" viewBox="0 0 26 13"><rect x=".5" y=".5" width="22" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".45"/><rect x="2.5" y="2.5" width="15" height="8" rx="2" fill="currentColor"/><rect x="23.5" y="4.5" width="2" height="4" rx="1" fill="currentColor" opacity=".45"/></svg></div></div>`;
}

function libraryButton(size) {
  const bg = DARK ? '#2A2A2E' : '#E4E6EC';
  const m = size * .26, g = size * .08;
  const cols = ['#4A90FF', '#4ADE80', '#FF9A3D', '#FF6B8A'];
  return `<div class="ic" style="width:${size}px;height:${size}px;border-radius:${size*.235}px;background:${bg};box-shadow:none;display:grid;grid-template-columns:${m}px ${m}px;gap:${g}px;align-content:center;justify-content:center">${cols.map(c=>`<div style="width:${m}px;height:${m}px;border-radius:${m*.3}px;background:${c}"></div>`).join('')}</div>`;
}

function dock(pinned, recents, size, y) {
  const html = `<div class="dock">${pinned.map(n=>icon(n,size)).join('')}<div class="sep"></div>${recents.map(n=>icon(n,size)).join('')}${libraryButton(size)}</div>`;
  return `<div class="abs" style="left:0;right:0;top:${y}px;display:flex;justify-content:center">${html}</div>`;
}

function pageDots(y, count, active) {
  let d = '';
  for (let i = 0; i < count; i++) {
    const on = i === active;
    const c = DARK ? (on ? '#fff' : 'rgba(255,255,255,.35)') : (on ? '#1C1C1E' : 'rgba(28,28,30,.25)');
    d += i === 0 ? `<svg width="10" height="10" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2" fill="${c}"/><rect x="13" y="3" width="8" height="8" rx="2" fill="${c}"/><rect x="3" y="13" width="18" height="8" rx="2" fill="${c}"/></svg>`

function weatherGlyph(kind, s) {

  if (kind === 'rain') return `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M7 15a4 4 0 0 1-.4-8 5 5 0 0 1 9.6-.3A4.2 4.2 0 0 1 16.4 15z" fill="${DARK?'#9AA3B2':'#AEB7C6'}"/><path d="M8 17.5l-1 2.5M12 17.5l-1 2.5M16 17.5l-1 2.5" stroke="#3B9BFF" stroke-width="1.6" stroke-linecap="round"/></svg>`;
  if (kind === 'moon') return `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M15.5 3.5a8.5 8.5 0 1 0 5 13.6A7 7 0 0 1 15.5 3.5z" fill="#C9B8FF"/></svg>`;

}
function wWeather(x, y, w, h, big = false, compact = false) {

    ${big ? `<div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--line)">${[['Sat','sun',22,13],['Sun','part',20,12],['Mon','rain',16,10]].map(d=>`<div class="row" style="justify-content:space-between;font-size:14px;padding:5px 0"><span style="width:44px;font-weight:600">${d[0]}</span>${weatherGlyph(d[1],20)}<span style="color:var(--text2);width:34px;text-align:right">${d[3]}°</span><div style="width:110px;height:5px;border-radius:3px;background:linear-gradient(90deg,#5BC0FF,#FFC23A)"></div><span style="width:34px;text-align:right;font-weight:600">${d[2]}°</span></div>`).join('')}</div>` : ''}

    ? `<div style="display:grid;grid-template-columns:${small}px ${small}px;gap:8px">${apps.slice(3,7).map(a=>icon(a,small)).join('')}</div>`
    : icon(apps[3], big);
  return `<div class="abs" style="left:${x}px;top:${y}px;width:${size}px">
    <div style="width:${size}px;height:${size}px;border-radius:34px;background:var(--card);box-shadow:var(--shadow);padding:${pad}px;display:grid;grid-template-columns:${big}px ${big}px;gap:${gap}px">
      ${apps.slice(0,3).map(a=>icon(a,big)).join('')}${q4}</div>
    <div style="text-align:center;font-size:13.5px;font-weight:600;color:var(--text);margin-top:9px">${title}</div></div>`;
}
